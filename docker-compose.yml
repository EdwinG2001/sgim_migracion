services:
  sgim-migracion:
    container_name: sgim-migracion
    build:
      context: .
      dockerfile: Dockerfile
    image: sgim-migracion:latest
    restart: unless-stopped
    ports:
      - "8082:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
